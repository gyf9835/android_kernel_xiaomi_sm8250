name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device codename'
        required: true
        default: 'elish'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU + SuSFS)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
      droidspaces:
        description: 'Enable DroidSpaces support'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build ${{ inputs.device }} | KSU:${{ inputs.ksu }} | OS:${{ inputs.target_os }} | DS:${{ inputs.droidspaces }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Environment
      timeout-minutes: 15
      run: |
        export DEBIAN_FRONTEND=noninteractive
        APT="sudo -E apt-get -y -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"

        # apt-get update can stall for tens of minutes on a bad mirror day; the
        # runner image already ships a usable index, so a failed update is not
        # fatal as long as the packages below resolve.
        # Runners occasionally come up with a broken resolver
        # ("Temporary failure resolving 'archive.ubuntu.com'"), which makes apt
        # hang until the step timeout. Verify DNS first and borrow a public
        # resolver if the default one cannot answer.
        if ! getent hosts archive.ubuntu.com >/dev/null 2>&1; then
          echo "DNS resolution failed, switching to public resolvers"
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
          getent hosts archive.ubuntu.com || { echo "DNS still broken"; exit 1; }
        fi

        timeout 300 $APT update || echo "apt update skipped (slow or failed)"

        # Required tools. These must succeed.
        timeout 900 $APT install --no-install-recommends \
          ccache build-essential bc bison flex git curl wget zip unzip \
          libssl-dev libncurses-dev libelf-dev zlib1g-dev libxml2-dev \
          python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          || { echo "required packages failed to install"; exit 1; }

        # Optional helpers: only install the names the image can resolve.
        OPT=""
        for p in gawk gperf imagemagick lz4 libxml2 libxml2-utils lzop \
                 pngcrush rsync schedtool squashfs-tools xsltproc \
                 python-is-python3; do
          if apt-cache policy "$p" 2>/dev/null | grep -q "Candidate: [0-9]"; then
            OPT="$OPT $p"
          else
            echo "skipping unavailable package: $p"
          fi
        done
        [ -n "$OPT" ] && timeout 600 $APT install --no-install-recommends $OPT || true

        # zyc-clang ships ld.lld linked against libxml2.so.2; without it every
        # clang driver invocation dies with "libxml2.so.2: cannot open shared
        # object file". Ubuntu 25.10+ renamed the runtime to libxml2-16 with a
        # new soname (libxml2.so.16) and no longer ships libxml2.so.2, so no
        # package on a resolute runner can ever satisfy it. Extract the real
        # 2.9.14 runtime from the noble pool instead; if the pool fetch fails,
        # fall back to a soname symlink (lld only touches a small stable
        # subset of the API, and only for Windows manifest merging, which a
        # kernel build never exercises).
        if ! ldconfig -p | grep -q "libxml2.so.2"; then
          echo "distro does not provide libxml2.so.2; fetching noble runtime"
          NOBLE_DEB="http://archive.ubuntu.com/ubuntu/pool/main/libx/libxml2/libxml2_2.9.14+dfsg-1.3ubuntu3.10_amd64.deb"
          if timeout 120 wget --tries=2 -q -O /tmp/libxml2-compat.deb "$NOBLE_DEB"; then
            sudo mkdir -p /opt/libxml2-compat /usr/local/libxml2-compat/lib
            sudo dpkg-deb -x /tmp/libxml2-compat.deb /opt/libxml2-compat
            sudo cp -a /opt/libxml2-compat/usr/lib/x86_64-linux-gnu/libxml2.so.2* \
              /usr/local/libxml2-compat/lib/ 2>/dev/null || true
            echo "/usr/local/libxml2-compat/lib" | sudo tee /etc/ld.so.conf.d/libxml2-compat.conf >/dev/null
            sudo ldconfig
          fi
        fi
        if ! ldconfig -p | grep -q "libxml2.so.2"; then
          echo "noble deb unavailable; symlinking libxml2.so.2 -> libxml2.so.16"
          SO16="$(ldconfig -p | awk '/libxml2\.so\.16/{print $NF; exit}')"
          if [ -n "$SO16" ]; then
            sudo ln -sf "$SO16" /usr/lib/x86_64-linux-gnu/libxml2.so.2
            sudo ldconfig
          fi
        fi
        ldconfig -p | grep -q "libxml2.so.2" \
          || [ -e /usr/lib/x86_64-linux-gnu/libxml2.so.2 ] \
          || [ -e /usr/local/libxml2-compat/lib/libxml2.so.2 ] \
          || { echo "MISSING libxml2 runtime"; exit 1; }

        for b in ccache make clang aarch64-linux-gnu-gcc python3; do
          command -v "$b" >/dev/null || { echo "MISSING required tool: $b"; exit 1; }
        done
        mkdir -p ~/.cache/ccache_mikernel
        ccache -M 10G

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-${{ inputs.ksu }}-${{ inputs.droidspaces }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-${{ inputs.ksu }}-${{ inputs.droidspaces }}-
          ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        URL=https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        for attempt in 1 2 3 4; do
          wget --timeout=120 --tries=2 -q -O clang.tar.gz "$URL" && break
          echo "clang download attempt $attempt failed"
          sleep 10
        done
        test -s clang.tar.gz || { echo "could not download zyc-clang"; exit 1; }
        tar -zxf clang.tar.gz
        "$HOME/zyc-clang/bin/clang" --version
        # Ground-truth check: ld.lld is the binary that needs libxml2.so.2.
        # If it cannot start, the kernel link would fail far later.
        "$HOME/zyc-clang/bin/ld.lld" --version

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh

        ARGS="${{ inputs.device }}"

        if [ "${{ inputs.ksu }}" = "true" ]; then
          ARGS="$ARGS ksu"
        fi

        if [ "${{ inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ inputs.target_os }}"
        fi

        if [ "${{ inputs.droidspaces }}" = "true" ]; then
          ARGS="$ARGS droidspaces"
        fi

        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: APTKernel-${{ inputs.device }}-${{ inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0
