name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'elish'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU + SuSFS)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
      droidspaces:
        description: 'Enable DroidSpaces support'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build ${{ inputs.device }} | KSU:${{ inputs.ksu }} | OS:${{ inputs.target_os }} | DS:${{ inputs.droidspaces }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        # One apt transaction instead of ~20 sequential installs. Packages that
        # the runner image no longer ships (libxml2 on Ubuntu 26, ...) are
        # filtered out first: a single unavailable name makes apt install none.
        sudo apt-get update -o Acquire::Retries=3
        WANT="bc bison build-essential ccache curl flex gawk git gnupg gperf \
              imagemagick libncurses-dev libssl-dev libelf-dev lz4 libxml2 \
              libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
              xsltproc zip zlib1g-dev python3 python-is-python3 \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi"
        AVAIL=$(apt-cache pkgnames | sort -u)
        PKGS=""
        for p in $WANT; do
          if echo "$AVAIL" | grep -qx "$p"; then
            PKGS="$PKGS $p"
          else
            echo "skipping unavailable package: $p"
          fi
        done
        echo "installing:$PKGS"
        for attempt in 1 2 3; do
          sudo apt-get install -y --no-install-recommends $PKGS && break
          echo "apt attempt $attempt failed"
          sudo apt-get -f install -y || true
          sleep 10
        done
        for b in ccache make clang aarch64-linux-gnu-gcc python3; do
          command -v "$b" >/dev/null || { echo "MISSING required tool: $b"; exit 1; }
        done
        mkdir -p ~/.cache/ccache_mikernel
        ccache -M 10G

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-${{ inputs.ksu }}-${{ inputs.droidspaces }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-${{ inputs.ksu }}-${{ inputs.droidspaces }}-
          ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        URL=https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        for attempt in 1 2 3 4; do
          wget --timeout=120 --tries=2 -q -O clang.tar.gz "$URL" && break
          echo "clang download attempt $attempt failed"
          sleep 10
        done
        test -s clang.tar.gz || { echo "could not download zyc-clang"; exit 1; }
        tar -zxf clang.tar.gz
        "$HOME/zyc-clang/bin/clang" --version

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh

        ARGS="${{ inputs.device }}"

        if [ "${{ inputs.ksu }}" = "true" ]; then
          ARGS="$ARGS ksu"
        fi

        if [ "${{ inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ inputs.target_os }}"
        fi

        if [ "${{ inputs.droidspaces }}" = "true" ]; then
          ARGS="$ARGS droidspaces"
        fi

        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: APTKernel-${{ inputs.device }}-${{ inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0
