name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'elish'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU + SuSFS)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
          - both
      droidspaces:
        description: 'Enable DroidSpaces support'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build ${{ inputs.device }} | KSU:${{ inputs.ksu }} | OS:${{ inputs.target_os }} | DS:${{ inputs.droidspaces }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        # Runner images differ (Ubuntu 24.04 vs 26.04): install each tool
        # individually so a renamed/optional package cannot abort the job.
        for pkg in bc bison build-essential ccache curl flex gawk git gnupg \
                   gperf imagemagick libncurses-dev libssl-dev libelf-dev \
                   liblz4-tool lz4 libxml2 libxml2-utils lzop pngcrush rsync \
                   schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
                   python-is-python3; do
          sudo apt-get install -y "$pkg" || echo "optional package $pkg unavailable, skipped"
        done
        mkdir -p ~/.cache/ccache_mikernel
        ccache -M 10G

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-${{ inputs.ksu }}-${{ inputs.droidspaces }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-${{ inputs.ksu }}-${{ inputs.droidspaces }}-
          ${{ runner.os }}-kernel-ccache-${{ inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh

        ARGS="${{ inputs.device }}"

        if [ "${{ inputs.ksu }}" = "true" ]; then
          ARGS="$ARGS ksu"
        fi

        if [ "${{ inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ inputs.target_os }}"
        fi

        if [ "${{ inputs.droidspaces }}" = "true" ]; then
          ARGS="$ARGS droidspaces"
        fi

        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: APTKernel-${{ inputs.device }}-${{ inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0
